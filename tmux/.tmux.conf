# 1. VISUALS & MOUSE
set -g mouse on
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:RGB"

# 2. PREFIX & EXTENDED KEYS
unbind C-b
unbind C-Space
set -g prefix M-B
bind M-B send-prefix

# Required for modified number keys in terminals that support extended keys.
set -s extended-keys always
set -as terminal-features ",xterm-kitty:extkeys"

# 3. NAVIGATION
# Cycle through windows with Ctrl+PageUp and Ctrl+PageDown.
bind -n C-Pagedown next-window
bind -n C-Pageup previous-window

# Select windows directly with Ctrl+1 through Ctrl+9.
bind -n C-1 select-window -t :=1
bind -n C-2 select-window -t :=2
bind -n C-3 select-window -t :=3
bind -n C-4 select-window -t :=4
bind -n C-5 select-window -t :=5
bind -n C-6 select-window -t :=6
bind -n C-7 select-window -t :=7
bind -n C-8 select-window -t :=8
bind -n C-9 select-window -t :=9

# Move between panes without the prefix.
bind -n M-n select-pane -L
bind -n M-i select-pane -R
bind -n M-u select-pane -U
bind -n M-e select-pane -D

# 4. WINDOW MANAGEMENT
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Open new panes in the current directory (Standard keys)
# Split horizontal with | and vertical with - (Easier to remember than " and %)
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane and window shortcuts without the prefix.
bind -n M-o split-window -h -b -c "#{pane_current_path}"
bind -n M-h split-window -v -c "#{pane_current_path}"
bind -n M-m command-prompt -I "#W" "rename-window '%%'"
bind -n M-k copy-mode

# Shrink or grow the active pane width by five columns.
bind -n M-l run-shell 'tmux resize-pane -t "#{pane_id}" -x "#{e|-:#{pane_width},5}"'
bind -n M-y run-shell 'tmux resize-pane -t "#{pane_id}" -x "#{e|+:#{pane_width},5}"'

# 5. THEME & PLUGINS (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux'

# Configure Yank
set -g @yank_selection_mouse 'clipboard'

# Configure Catppuccin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Status line configuration
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# 6. INITIALIZE TPM
# Keep this line at the very bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'
